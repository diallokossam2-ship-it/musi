name: Compiler Application Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code source du projet depuis GitHub
      - name: Code Checkout
        uses: actions/checkout@v4

      # Étape 2 : Installer et configurer l'environnement Java (JDK 17 requis pour Android moderne)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Étape 3 : Donner les droits d'exécution au script Gradle (gradlew)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Étape 4 : Compiler l'application en mode Debug (génère un fichier APK testable)
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      # Étape 5 : Sauvegarder le fichier APK généré pour pouvoir le télécharger depuis GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
