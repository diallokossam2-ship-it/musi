name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier que le modèle vocal Vosk est présent
        run: |
          if [ ! -f app/src/main/assets/model-fr/am/final.mdl ]; then
            echo "::error::Modèle vocal absent. Mets le contenu de vosk-model-small-fr-0.22 dans app/src/main/assets/model-fr/"
            exit 1
          fi

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Gradle 8.9 (avec cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK debug
        run: gradle assembleDebug --stacktrace

      - name: Envoyer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MonLecteur-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
