name: Build APK Musi Player - Local AI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Web App and Capacitor Project
        run: |
          mkdir -p musi-android/www
          cd musi-android

          # Initialisation de package.json
          cat << 'EOF' > package.json
          {
            "name": "musi-player",
            "version": "1.0.0",
            "description": "Musi Player avec IA Locale",
            "main": "index.js",
            "dependencies": {
              "@capacitor/core": "^5.0.0",
              "@capacitor/android": "^5.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^5.0.0"
            }
          }
          EOF

          npm install

          # Configuration Capacitor
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.musi.app",
            "appName": "Musi Player",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          # Creation du fichier HTML/JS principal
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Musi Player AI</title>
              <style>
                  body {
                      font-family: Arial, sans-serif;
                      background-color: #121212;
                      color: #ffffff;
                      display: flex;
                      flex-direction: column;
                      align-items: center;
                      justify-content: center;
                      height: 100vh;
                      margin: 0;
                      padding: 20px;
                      box-sizing: border-box;
                  }
                  .card {
                      background: #1e1e1e;
                      padding: 25px;
                      border-radius: 15px;
                      text-align: center;
                      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
                      width: 100%;
                      max-width: 400px;
                  }
                  button {
                      background-color: #1db954;
                      color: white;
                      border: none;
                      padding: 15px 25px;
                      font-size: 16px;
                      border-radius: 30px;
                      cursor: pointer;
                      margin: 10px;
                      font-weight: bold;
                  }
                  button:disabled {
                      background-color: #555;
                  }
                  .status {
                      margin-top: 15px;
                      font-size: 14px;
                      color: #b3b3b3;
                  }
                  .response {
                      margin-top: 20px;
                      padding: 10px;
                      background: #282828;
                      border-radius: 8px;
                      min-height: 50px;
                  }
              </style>
          </head>
          <body>
              <div class="card">
                  <h2>Musi Player (IA Locale)</h2>
                  <audio id="audioPlayer" controls style="width: 100%; margin-top: 15px;"></audio>
                  <div style="margin-top: 20px;">
                      <button id="btnListen">Démarrer l'écoute ("Musi")</button>
                  </div>
                  <div class="status" id="statusText">Statut : En attente...</div>
                  <div class="response" id="responseText">Dites "Musi" puis votre commande...</div>
              </div>

              <script>
                  const audio = document.getElementById('audioPlayer');
                  const statusText = document.getElementById('statusText');
                  const responseText = document.getElementById('responseText');
                  const btnListen = document.getElementById('btnListen');

                  let recognition;
                  let silenceTimer;
                  const SILENCE_TIMEOUT = 5000; // 5 secondes de tolérance au silence

                  // Verification de la reconnaissance vocale
                  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

                  if (SpeechRecognition) {
                      recognition = new SpeechRecognition();
                      recognition.continuous = true;
                      recognition.interimResults = true;
                      recognition.lang = 'fr-FR';

                      let fullTranscript = '';

                      recognition.onstart = () => {
                          statusText.innerText = "Statut : Écoute active (parlez librement)...";
                      };

                      recognition.onresult = (event) => {
                          clearTimeout(silenceTimer);
                          let interimTranscript = '';

                          for (let i = event.resultIndex; i < event.results.length; ++i) {
                              if (event.results[i].isFinal) {
                                  fullTranscript += event.results[i][0].transcript + ' ';
                              } else {
                                  interimTranscript += event.results[i][0].transcript;
                              }
                          }

                          responseText.innerText = fullTranscript + interimTranscript;

                          // Réinitialiser le minuteur de silence (attendre 5s avant de traiter la commande)
                          silenceTimer = setTimeout(() => {
                              recognition.stop();
                              processCommand(fullTranscript.trim());
                              fullTranscript = '';
                          }, SILENCE_TIMEOUT);
                      };

                      recognition.onerror = (event) => {
                          statusText.innerText = "Erreur d'écoute : " + event.error;
                      };

                      recognition.onend = () => {
                          statusText.innerText = "Statut : En attente...";
                      };

                      btnListen.addEventListener('click', () => {
                          fullTranscript = '';
                          responseText.innerText = "À l'écoute...";
                          recognition.start();
                      });
                  } else {
                      statusText.innerText = "Reconnaissance vocale non supportée par ce composant.";
                  }

                  // Traitement des commandes et Synthèse vocale Hors-Ligne
                  function processCommand(text) {
                      if (!text) return;
                      
                      let lower = text.toLowerCase();
                      let reply = "";

                      // Audio Ducking : Baisse le son de la musique pendant que l'IA parle
                      let originalVolume = audio.volume;
                      audio.volume = 0.1;

                      if (lower.includes("pause") || lower.includes("stoppe")) {
                          audio.pause();
                          reply = "J'ai mis la musique en pause, patron.";
                      } else if (lower.includes("joue") || lower.includes("lance")) {
                          audio.play();
                          reply = "Lecture en cours, patron.";
                      } else if (lower.includes("augmente") || lower.includes("plus fort")) {
                          audio.volume = Math.min(1, originalVolume + 0.2);
                          reply = "J'ai augmenté le volume.";
                      } else if (lower.includes("baisse") || lower.includes("diminue")) {
                          audio.volume = Math.max(0, originalVolume - 0.2);
                          reply = "J'ai baissé le volume.";
                      } else {
                          reply = "J'ai bien entendu : " + text + ". Traitement local en cours.";
                      }

                      speakOut(reply, () => {
                          // Restauration du volume original après la réponse vocale
                          if (!lower.includes("baisse") && !lower.includes("augmente")) {
                              audio.volume = originalVolume;
                          }
                      });
                  }

                  // Synthèse vocale native Hors-Ligne
                  function speakOut(text, onEndCallback) {
                      if ('speechSynthesis' in window) {
                          window.speechSynthesis.cancel();
                          const utterance = new SpeechSynthesisUtterance(text);
                          utterance.lang = 'fr-FR';
                          utterance.rate = 1.0;

                          utterance.onend = () => {
                              if (onEndCallback) onEndCallback();
                          };

                          window.speechSynthesis.speak(utterance);
                      } else {
                          if (onEndCallback) onEndCallback();
                      }
                  }
              </script>
          </body>
          </html>
          EOF

          # Initialisation du projet Android Capacitor
          npx cap add android

      - name: Configure Android Permissions
        run: |
          MANIFEST="musi-android/android/app/src/main/AndroidManifest.xml"
          
          # Ajout des permissions Record Audio et Modification Audio
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>' $MANIFEST

      - name: Build Android APK
        run: |
          cd musi-android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: musi-debug-apk
          path: musi-android/android/app/build/outputs/apk/debug/app-debug.apk
