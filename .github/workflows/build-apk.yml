name: Build APK Musi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1 - Recuperer le depot
        uses: actions/checkout@v4

      - name: 2 - Verifier ou Generer le projet Musi complet
        shell: bash
        run: |
          mkdir -p musi-android/src musi-android/www

          # package.json
          cat << 'EOF' > musi-android/package.json
          {
            "name": "musi-android",
            "version": "1.2.0",
            "description": "Musi Android AI Voice App",
            "main": "src/plugins.js",
            "scripts": {
              "build:js": "echo 'Building JS plugins...'",
              "cap:sync": "cap sync android"
            },
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF

          # capacitor.config.json
          cat << 'EOF' > musi-android/capacitor.config.json
          {
            "appId": "com.musi.app",
            "appName": "Musi AI",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          # index.html complet avec UI moderne et IA vocale
          cat << 'EOF' > musi-android/www/index.html
          <!DOCTYPE html>
          <html lang="fr">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Musi AI Voice</title>
              <style>
                  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
                  body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; align-items: center; padding: 24px; text-align: center; }
                  header { margin-top: 20px; }
                  header h1 { font-size: 2rem; color: #38bdf8; font-weight: 700; letter-spacing: -0.5px; }
                  header p { font-size: 0.9rem; color: #94a3b8; margin-top: 4px; }
                  
                  .ai-visualizer { position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; margin: 30px 0; }
                  .pulse-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: rgba(56, 189, 248, 0.15); animation: pulse 2s infinite ease-in-out; }
                  .mic-btn { position: relative; z-index: 10; width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; color: white; font-size: 2.2rem; cursor: pointer; box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.5); transition: transform 0.2s, background 0.2s; display: flex; align-items: center; justify-content: center; }
                  .mic-btn:active { transform: scale(0.92); }
                  .mic-btn.listening { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.6); }

                  @keyframes pulse { 0% { transform: scale(0.85); opacity: 0.8; } 50% { transform: scale(1.15); opacity: 0.2; } 100% { transform: scale(0.85); opacity: 0.8; } }

                  .chat-box { width: 100%; max-width: 400px; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; min-height: 140px; display: flex; flex-direction: column; justify-content: center; gap: 8px; backdrop-filter: blur(8px); }
                  .user-text { color: #cbd5e1; font-size: 0.95rem; font-style: italic; }
                  .ai-response { color: #38bdf8; font-size: 1.05rem; font-weight: 600; }

                  .controls { width: 100%; max-width: 400px; display: flex; justify-content: space-around; margin-bottom: 20px; }
                  .action-btn { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 12px 20px; border-radius: 12px; font-size: 0.85rem; font-weight: 500; cursor: pointer; }
                  .action-btn:active { background: #334155; }
              </style>
          </head>
          <body>
              <header>
                  <h1>Musi Voice AI</h1>
                  <p>Assistant Vocal Interactif</p>
              </header>

              <div class="ai-visualizer">
                  <div class="pulse-ring" id="pulse"></div>
                  <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎙️</button>
              </div>

              <div class="chat-box">
                  <div class="user-text" id="userSpeech">Appuyez sur le micro et parlez...</div>
                  <div class="ai-response" id="aiReply">L'IA est prête à vous écouter.</div>
              </div>

              <div class="controls">
                  <button class="action-btn" onclick="testTTS()">🔊 Tester la voix</button>
                  <button class="action-btn" onclick="clearText()">🗑️ Effacer</button>
              </div>

              <script>
                  let isListening = false;
                  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                  let recognition = null;

                  if (SpeechRecognition) {
                      recognition = new SpeechRecognition();
                      recognition.lang = 'fr-FR';
                      recognition.continuous = false;
                      recognition.interimResults = false;

                      recognition.onstart = function() {
                          isListening = true;
                          document.getElementById('micBtn').classList.add('listening');
                          document.getElementById('userSpeech').innerText = "Écoute en cours...";
                      };

                      recognition.onresult = function(event) {
                          const transcript = event.results[0][0].transcript;
                          document.getElementById('userSpeech').innerText = '"' + transcript + '"';
                          processVoiceCommand(transcript);
                      };

                      recognition.onerror = function(event) {
                          console.error(event.error);
                          stopListening();
                          document.getElementById('aiReply').innerText = "Erreur de reconnaissance vocale : " + event.error;
                      };

                      recognition.onend = function() {
                          stopListening();
                      };
                  } else {
                      document.getElementById('userSpeech').innerText = "Reconnaissance vocale non supportée sur ce navigateur.";
                  }

                  function toggleVoice() {
                      if (!recognition) return alert("Reconnaissance vocale non disponible.");
                      if (isListening) {
                          recognition.stop();
                      } else {
                          recognition.start();
                      }
                  }

                  function stopListening() {
                      isListening = false;
                      document.getElementById('micBtn').classList.remove('listening');
                  }

                  function processVoiceCommand(text) {
                      const lower = text.toLowerCase();
                      let reply = "Commande reçue : " + text;

                      if (lower.includes("bonjour") || lower.includes("salut")) {
                          reply = "Bonjour ! Je suis votre assistant vocal Musi. Que puis-je faire pour vous ?";
                      } else if (lower.includes("musique") || lower.includes("joue")) {
                          reply = "Lancement de la musique...";
                      } else if (lower.includes("qui es-tu") || lower.includes("ton nom")) {
                          reply = "Je suis Musi, votre intelligence artificielle vocale embarquée.";
                      }

                      document.getElementById('aiReply').innerText = reply;
                      speak(reply);
                  }

                  function speak(text) {
                      if ('speechSynthesis' in window) {
                          window.speechSynthesis.cancel();
                          const utterance = new SpeechSynthesisUtterance(text);
                          utterance.lang = 'fr-FR';
                          window.speechSynthesis.speak(utterance);
                      }
                  }

                  function testTTS() {
                      speak("Bonjour patron ! Le système vocal de l'application Musi fonctionne parfaitement.");
                      document.getElementById('aiReply').innerText = "Test vocal effectué avec succès !";
                  }

                  function clearText() {
                      document.getElementById('userSpeech').innerText = "Appuyez sur le micro et parlez...";
                      document.getElementById('aiReply').innerText = "L'IA est prête à vous écouter.";
                  }
              </script>
          </body>
          </html>
          EOF

          echo "Dossier musi-android et interface vocale generes !"

      - name: 3 - Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4 - Configurer Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 5 - Installer les dependances npm
        working-directory: musi-android
        run: |
          npm install --legacy-peer-deps

      - name: 6 - Generer les scripts JS
        working-directory: musi-android
        run: |
          npm run build:js || true

      - name: 7 - Preparer le projet Android et Permissions Micro
        working-directory: musi-android
        run: |
          npx cap add android || true
          npx cap sync android || true
          
          # Ajout explicite de la permission Micro dans AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST_PATH"
            echo "Permissions Micro ajoutees avec succes !"
          fi

      - name: 8 - Compiler l APK Debug
        working-directory: musi-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9 - Exporter l APK
        uses: actions/upload-artifact@v4
        with:
          name: musi-debug-apk
          path: musi-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
