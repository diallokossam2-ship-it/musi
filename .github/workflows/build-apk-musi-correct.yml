name: Musi Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Detecter le dossier du projet
        id: project
        shell: bash
        run: |
          if [ -f "package.json" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "musi-android/package.json" ]; then
            echo "dir=musi-android" >> "$GITHUB_OUTPUT"
          else
            echo "package.json introuvable"
            exit 1
          fi

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les dependances
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install --legacy-peer-deps

      - name: Ajouter Android
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Construire les fichiers Musi
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run build:js

      - name: Synchroniser Capacitor
        working-directory: ${{ steps.project.outputs.dir }}
        run: npx cap sync android

      - name: Appliquer les permissions Android
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f patch-manifest.sh ]; then
            bash patch-manifest.sh
          fi

      - name: Compiler l'APK Debug
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Musi-debug-apk
          path: ${{ steps.project.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
