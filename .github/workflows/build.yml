name: Construire Parole de Vie (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler l'application Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle et son cache
        uses: gradle/actions/setup-gradle@v4

      - name: Installer les outils Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Accepter la licence Android et installer Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Télécharger et valider la Bible complète Louis Segond 1910
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --output app/src/main/assets/bible.json \
            https://raw.githubusercontent.com/azerty-245/bible-apk/1fba91d6e23cd8d65236bfa82f136cd004b8feab/raw_data/FRLSG.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('app/src/main/assets/bible.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          books = {row.get('book') for row in data if isinstance(row, dict)}
          if len(data) < 30000 or len(books) != 66:
              raise SystemExit(f'Corpus incomplet : {len(data)} versets, {len(books)} livres')
          if not all({'book', 'chapter', 'verse', 'text'} <= row.keys() for row in data[:100]):
              raise SystemExit('Format inattendu dans le corpus biblique')
          print(f'Bible validée : {len(data)} versets, {len(books)} livres, {path.stat().st_size} octets')
          PY

      - name: Compiler l'APK de test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Afficher la taille réelle de l'APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          MIB=$(awk -v n="$BYTES" 'BEGIN { printf "%.2f", n/1048576 }')
          echo "Taille réelle de l'APK : $BYTES octets ($MIB Mio)"
          echo "### Taille de l'APK" >> "$GITHUB_STEP_SUMMARY"
          echo "**$MIB Mio** ($BYTES octets) — aucune limite de taille imposée." >> "$GITHUB_STEP_SUMMARY"
      - name: Publier l'APK en artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: parole-de-vie-apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
