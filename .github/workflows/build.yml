name: Compiler l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Tests et compilation Android
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Extraire le projet LKH
        run: |
          mkdir -p project
          unzip -o lkh-projet.zip -d project

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython==0.29.36"

      - name: Exécuter les tests
        working-directory: project
        run: python -m unittest discover -v

      - name: Restaurer le cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            project/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('lkh-projet.zip') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Compiler l'APK de débogage
        working-directory: project
        run: buildozer -v android debug

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: lkh-bible-apk
          path: project/bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier une Release téléchargeable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" project/bin/*.apk \
            --title "LKH Bible - build ${{ github.run_number }}" \
            --notes "APK de test (debug), compilé automatiquement après validation des tests."
