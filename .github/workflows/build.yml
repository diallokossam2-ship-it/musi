name: Construire Parole de Vie (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler l'application Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle et son cache
        uses: gradle/actions/setup-gradle@v4

      - name: Installer les outils Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Accepter la licence Android et installer Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compiler l'APK de test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Afficher et vérifier la taille de l'APK
        id: apk-size
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          echo "APK_SIZE_BYTES=$BYTES"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          if [ "$BYTES" -le 5000000 ]; then
            echo "Objectif atteint : APK inférieur ou égal à 5 000 000 octets."
          else
            echo "::error::APK trop volumineux : $BYTES octets (limite 5 000 000)."
            exit 1
          fi

      - name: Publier l'APK en artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: parole-de-vie-apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
