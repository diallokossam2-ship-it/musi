name: Compiler l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # permet aussi de lancer à la main depuis l'onglet Actions

permissions:
  contents: write   # nécessaire pour publier la Release

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write   # nécessaire pour publier la Release
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.36"

      - name: Cache (accélère les compilations suivantes)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Compiler l'APK
        run: buildozer -v android debug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: lkh-bible-apk
          path: bin/*.apk

      - name: Publier une Release (lien de téléchargement direct)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" bin/*.apk \
            --title "LKH Bible - build ${{ github.run_number }}" \
            --notes "APK de test (debug), compilé automatiquement."

      - name: Publier une Release (lien de téléchargement direct)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" bin/*.apk \
            --target "${{ github.sha }}" \
            --title "LKH Bible - build ${{ github.run_number }}" \
            --notes "APK de test compilé automatiquement."
