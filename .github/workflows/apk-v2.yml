name: Build APK Musi v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1 - Recuperer le depot
        uses: actions/checkout@v4

      - name: 2 - Decompresser le projet
        run: |
          ls -la
          unzip -o musi-android.zip
          ls -la musi-android

      - name: 3 - Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4 - Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 5 - Installer les dependances
        working-directory: musi-android
        run: |
          node -v
          npm install --legacy-peer-deps

      - name: 6 - Regrouper les plugins
        working-directory: musi-android
        run: npm run build:js

      - name: 7 - Creer le projet Android
        working-directory: musi-android
        run: |
          npx cap add android
          npx cap sync android
          bash patch-manifest.sh

      - name: 8 - Compiler l APK
        working-directory: musi-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9 - Envoyer l APK
        uses: actions/upload-artifact@v4
        with:
          name: musi-apk
          path: musi-android/android/app/build/outputs/apk/debug/app-debug.apk
