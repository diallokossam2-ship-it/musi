name: Build APK Musi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1 - Recuperer le depot
        uses: actions/checkout@v4

      - name: 2 - Generer l arborescence musi-android
        shell: bash
        run: |
          mkdir -p musi-android/src musi-android/www

          # package.json
          cat << 'EOF' > musi-android/package.json
          {
            "name": "musi-android",
            "version": "1.2.0",
            "description": "Musi Android App",
            "main": "src/plugins.js",
            "scripts": {
              "build:js": "echo 'Building JS plugins...'",
              "cap:sync": "cap sync android"
            },
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF

          # capacitor.config.json
          cat << 'EOF' > musi-android/capacitor.config.json
          {
            "appId": "com.musi.app",
            "appName": "Musi",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          # Fichiers de base
          echo "console.log('Musi plugins loaded.');" > musi-android/src/plugins.js
          echo "<!DOCTYPE html><html><head><title>Musi App</title></head><body><h1>Musi App</h1></body></html>" > musi-android/www/index.html
          echo "// Plugins bundle" > musi-android/www/plugins.js
          echo "# Musi Project" > musi-android/LISEZMOI.md

          echo "Dossier musi-android pret !"

      - name: 3 - Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4 - Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 5 - Installer les dependances npm
        working-directory: musi-android
        run: |
          npm install --legacy-peer-deps

      - name: 6 - Generer les scripts JS
        working-directory: musi-android
        run: |
          npm run build:js || true

      - name: 7 - Preparer le projet Android
        working-directory: musi-android
        run: |
          npx cap add android || true
          npx cap sync android || true

      - name: 8 - Compiler l APK Debug
        working-directory: musi-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9 - Exporter l APK
        uses: actions/upload-artifact@v4
        with:
          name: musi-debug-apk
          path: musi-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
