name: Build APK Musi 1.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1 - Recuperer le depot
        uses: actions/checkout@v4

      - name: 2 - Verifier les fichiers
        shell: bash
        run: |
          echo "=== Contenu du dossier racine ==="
          ls -la
          
          ZIP_NAME=""
          if [ -f "Musi-1.2.0-github-ready-fixed.zip" ]; then
            ZIP_NAME="Musi-1.2.0-github-ready-fixed.zip"
          elif [ -f "Musi-1.2.0-github-ready.zip" ]; then
            ZIP_NAME="Musi-1.2.0-github-ready.zip"
          else
            FOUND_ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_ZIP" ]; then
              ZIP_NAME="$FOUND_ZIP"
            fi
          fi

          if [ -n "$ZIP_NAME" ]; then
            echo "Fichier Zip trouve : $ZIP_NAME"
            unzip -o "$ZIP_NAME"
          else
            echo "Aucun fichier zip trouve dans le depot."
          fi

          if [ ! -d "musi-android" ]; then
            echo "Dossier musi-android introuvable au niveau racine."
            exit 1
          fi

      - name: 3 - Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4 - Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 5 - Installer les dependances
        working-directory: musi-android
        run: |
          node -v
          npm -v
          npm install --legacy-peer-deps

      - name: 6 - Construire les plugins Musi
        working-directory: musi-android
        run: npm run build:js

      - name: 7 - Creer et synchroniser Android
        working-directory: musi-android
        run: |
          npx cap add android || true
          npx cap sync android
          if [ -f "patch-manifest.sh" ]; then
            bash patch-manifest.sh
          fi

      - name: 8 - Compiler l APK Debug
        working-directory: musi-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9 - Publier l APK
        uses: actions/upload-artifact@v4
        with:
          name: musi-1.2-debug-apk
          path: musi-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
