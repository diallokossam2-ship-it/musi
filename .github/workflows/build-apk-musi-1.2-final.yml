name: Build APK Musi 1.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1 - Recuperer le depot
        uses: actions/checkout@v4

      - name: 2 - Verifier et decompresser Musi 1.2
        shell: bash
        run: |
          set -e
          if [ -f "Musi-1.2.0-github-ready-fixed.zip" ]; then
            ZIP_FILE="Musi-1.2.0-github-ready-fixed.zip"
          elif [ -f "Musi-1.2.0-github-ready.zip" ]; then
            ZIP_FILE="Musi-1.2.0-github-ready.zip"
          else
            echo "Erreur: Aucun fichier zip Musi trouve!"
            exit 1
          fi
          echo "Utilisation de $ZIP_FILE"
          unzip -o "$ZIP_FILE"
          test -f "musi-android/package.json"
          test -f "musi-android/src/plugins.js"
          echo "Projet Musi detecte."

      - name: 3 - Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4 - Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 5 - Installer les dependances
        working-directory: musi-android
        run: |
          node -v
          npm -v
          npm install --legacy-peer-deps

      - name: 6 - Construire les plugins Musi
        working-directory: musi-android
        run: npm run build:js

      - name: 7 - Creer et synchroniser Android
        working-directory: musi-android
        run: |
          npx cap add android || true
          npx cap sync android
          bash patch-manifest.sh

      - name: 8 - Compiler l APK Debug
        working-directory: musi-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9 - Publier l APK
        uses: actions/upload-artifact@v4
        with:
          name: musi-1.2-debug-apk
          path: musi-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
